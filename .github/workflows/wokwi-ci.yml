name: Wokwi CI

on:
  push:
  pull_request:

env:
  # Stock MicroPython build for the generic ESP32. If this 404s, check
  # https://micropython.org/download/ESP32_GENERIC/ for the current filename.
  MP_FIRMWARE: ESP32_GENERIC-20260406-v1.28.0.bin

jobs:
  simulate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project:
          - 01-traffic-light
          - 02-traffic-light-lcd
          - 03-dht22-rolling-average
          - 04-ldr-window-stats
          - 05-temperature-to-servo
          - 06-joystick-dual-servo
          - 07-ldr-relay-switch
          - 08-micropython-lcd-thermostat
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the firmware image tool
        run: pip install "mp-image-tool-esp32[littlefs]"

      # wokwi-cli boots a bare MicroPython REPL — it does not upload the sketch.
      # So bake this folder's .py files into a littlefs partition and hand Wokwi
      # a firmware image that boots straight into main.py.
      - name: Bake ${{ matrix.project }} into a MicroPython image
        working-directory: ${{ matrix.project }}
        run: |
          set -euo pipefail
          curl -fSL "https://micropython.org/resources/firmware/${MP_FIRMWARE}" -o mp.bin
          python -c "open('mp-4m.bin','wb').write(open('mp.bin','rb').read().ljust(0x400000, b'\xff'))"
          mp-image-tool-esp32 mp-4m.bin --add vfs=fat:2M:2M --fs mkfs vfs --fs put *.py / -o firmware-fs.bin
          mp-image-tool-esp32 firmware-fs.bin --fs ls /

      - name: Simulate ${{ matrix.project }}
        uses: wokwi/wokwi-ci-action@v1
        with:
          token: ${{ secrets.WOKWI_CLI_TOKEN }}
          path: ${{ matrix.project }}
          scenario: scenario.test.yaml
          timeout: 90000
